name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: WINDOWS
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            WINDOWS/requirements.txt
            WINDOWS/requirements-dev.txt
            LINUX/requirements-linux.txt
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest
      - run: ruff check sharkman tests tools easy_run.py ../LINUX ../MAC

  macos-experimental:
    name: Mac imports, shared GUI, and regression tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15-intel]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: WINDOWS
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            WINDOWS/requirements.txt
            WINDOWS/requirements-dev.txt
            MAC/requirements-mac.txt
      - name: Install shared app and native bridge
        run: python -m pip install -e '.[dev]' -r ../MAC/requirements-mac.txt
      - name: Native import and simulated safety tests (no input posted)
        run: python -m pytest
      - name: Shared calibration GUI smoke test (no Roblox required)
        env:
          SHARKMAN_TEST_GUI: "1"
        run: python -m pytest tests/test_image_inspector.py tests/test_mac_gui.py
      - run: ruff check sharkman tests tools easy_run.py ../LINUX ../MAC
      - name: Launcher syntax
        run: bash -n '../MAC/Start SharkmanV3.command'
      - name: Record test boundary
        run: echo 'Mac gameplay, privacy-authorized capture, and real Space delivery remain UNVERIFIED.' >> "$GITHUB_STEP_SUMMARY"

  linux-x11-distributions:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: ubuntu
            image: ubuntu:24.04
          - distro: debian
            image: debian:stable
          - distro: fedora
            image: fedora:latest
          - distro: arch
            image: archlinux:latest
    container: ${{ matrix.image }}
    defaults:
      run:
        shell: bash
        working-directory: WINDOWS
    steps:
      - name: Install Python, Tk, Xvfb, and build prerequisites
        working-directory: ${{ github.workspace }}
        run: |
          case '${{ matrix.distro }}' in
            ubuntu|debian)
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y \
                python3 python3-venv python3-dev python3-tk gcc git xvfb \
                libgl1 libglib2.0-0 libxrandr2
              ;;
            fedora)
              dnf install -y python3 python3-pip python3-devel python3-tkinter \
                gcc git xorg-x11-server-Xvfb mesa-libGL glib2 libXrandr
              ;;
            arch)
              pacman -Syu --noconfirm python python-pip tk gcc git \
                xorg-server-xvfb mesa glib2 libxrandr
              ;;
          esac
      - uses: actions/checkout@v4
      - name: Trust this container checkout for Git privacy checks
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Install in an isolated environment
        run: |
          python3 -m venv /tmp/sharkman-ci-venv
          /tmp/sharkman-ci-venv/bin/python -m pip install -e '.[dev,linux]'
      - name: Shared tests and X11 smoke test
        run: |
          Xvfb :99 -screen 0 1280x800x24 > /tmp/sharkman-xvfb.log 2>&1 &
          xvfb_pid=$!
          trap 'kill "$xvfb_pid" 2>/dev/null || true' EXIT
          sleep 1
          DISPLAY=:99 XDG_SESSION_TYPE=x11 SHARKMAN_XVFB_SMOKE=1 SHARKMAN_TEST_GUI=1 \
            /tmp/sharkman-ci-venv/bin/python -m pytest
          /tmp/sharkman-ci-venv/bin/ruff check sharkman tests tools easy_run.py ../LINUX ../MAC
